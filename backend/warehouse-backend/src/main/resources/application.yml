server:
  port: 8085  # 后端端口（本地开发使用）
  servlet:
    context-path: /

spring:
  application:
    name: warehouse-backend
  
  # ========== CORS 配置（本地开发跨域） ==========
  web:
    cors:
      allowed-origins: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:5174"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"
      allow-credentials: true
  
  # ========== MySQL 数据源配置（本地MySQL） ==========
  datasource:
    url: jdbc:mysql://localhost:3306/warehouse?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  
  # ========== JPA 配置 ==========
  jpa:
    hibernate:
      ddl-auto: update  # 改为 update 避免数据丢失
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ========== 禁用数据初始化 ==========
  sql:
    init:
      mode: never

  # ========== H2 控制台（禁用） ==========
  h2:
    console:
      enabled: false

# ========== 日志配置 ==========
logging:
  level:
    root: INFO
    com.hqh: DEBUG
    org.hibernate: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/warehouse-backend.log

# ========== JWT配置 ==========
jwt:
  secret: warehouse-backend-secret-key-2024-10-16-1234567890abcdef
  expiration: 86400000

# ========== MQTT配置 ==========
mqtt:
  enabled: true  # 启用MQTT，禁用模拟数据生成
  broker: tcp://172.20.10.5:1883
  clientId: warehouse-backend
  topic:
    data: test1/data
    config: test1/config
  username:
  password: